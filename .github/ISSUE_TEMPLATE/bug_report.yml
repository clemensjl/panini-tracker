name: Fehler
description: Etwas funktioniert nicht oder eine Sticker-Nummer ist falsch
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Was passiert
      description: Bei falschen Nummern, Namen oder Teams: Sticker und was stattdessen stimmt
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: So lässt es sich nachstellen
  - type: input
    id: umgebung
    attributes:
      label: Browser und Gerät
      placeholder: "Safari, iPhone 15"
